# Local Postgres for development: `make db`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: railboard
      POSTGRES_PASSWORD: railboard
      POSTGRES_DB: railboard
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railboard"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
